            <!-- Connecting the form to FormSubmit API to actually send the email to your inbox! -->

                <!-- Disables the irritating FormSubmit Captcha -->
                <input type="hidden" name="_captcha" value="false">

                <input type="hidden" name="_subject" value="New submission from your portfolio!">

                <input type="email" name="email" placeholder="Enter your Email" required>
                <input type="text" name="subject" placeholder="Enter your Subject">
                <textarea name="message" id="" cols="40" rows="10" placeholder="Enter your Message" required></textarea>
